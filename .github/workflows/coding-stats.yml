name: Coding stats

# Rebuilds coding-stats.json (read by the Code Stats window) every day,
# whenever coding-profiles.json changes, or on demand from the Actions tab.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - coding-profiles.json
      - scripts/fetch-coding-stats.mjs

permissions:
  contents: write

concurrency:
  group: coding-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch stats
        run: node scripts/fetch-coding-stats.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add coding-stats.json
          git diff --cached --quiet && exit 0
          git commit -m "Refresh coding stats"
          git push
